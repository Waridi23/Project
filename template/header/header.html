<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href='https://fonts.googleapis.com/css?family=Asset' rel='stylesheet'>
        <title> Hero Image </title>
        <style>
			html,body{
				height:100%;
                margin:0;
                font-family:Asset;
			}
			
			/*The Hero Image */
			.hero-image{
			
			/* Use "linear-gradient" to add a darken background effect to the image (photographer.jpg). This will make the text easier to read */
			
                background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url("images/hero.jpeg");			/* Sets a specific height */
			
				height:40%;
				
			/* Positions and centers the image to scale nicely on all screens */
				
				background-position:center;
				background-repeat:no-repeat;
				background-size:cover;
				position:relative;
				
			}
			
			/*Place text in the middle of the image */
			
			.hero-text{
				text-align:center;
				position:absolute;
				top:50%;
				left:50%;
				transform:translate(-50%,-50%);
				color:#ffffff;
			}
			.navbar{
                position: fixed;
                color:#ffffff;
                display:flex;
                justify-content: space-between;
                align-items:center;
                padding: 50px 20px;
                z-index: 1000;
                float:right;
                }
            .navbar a{
                margin-left:15px;
                text-decoration:none;
                color:#ffffff;
                font-weight:bold;
                border: solid 1px #ffffff;
                border-radius:20px;
                padding:10px 20px;
                gap:15px;
                }
            nav a:hover{
                color: #cf6900;
                transform: translateY(-5px);
                box-shadow: 0 8px 16px rgba(0,0,0,0.12);
            }
            .left{
			    float:left;
			}

		</style>

    </head>
    <body>
        <header class="hero-image">
			<div class="hero-text">
				<h1> This is a Hero Image </h1>
				<p> This is a paragraph </p>
				<button> Hire Me </button>
			</div>
            <div class= "navbar">
                <img src= "images/logo.jpeg" height= "150" alt = "Logo" class="left">
                    <nav>
                        <a href = "header.html"> Home </a>
                        <a href= "#"> About Us </a>
                        <a href= "#"> Contact </a>
                        <a href= "#"> Order </a>
            
                    </nav> 
            </div>
        </header>
			
        
    </body>
</html>

<!DOCYYPE html>

<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name ="keywords" content="Student intformation">
	<title> Student Information </title>
</head>

<body>
	<h1> Student Information </h1>
	<form name ="student input" id = "student input" method ="get" action="file.php">
	<legend> Student Input </legend>
	<p> Enter Student Name: <input type = "text" name = "Student" id ="student" placeholder="Enter student name" required> </p>
	<p> Enter Age: <input type= "number" id ="age" min="10" max="100" required> </p>
	<p> Enter Password: <input type="password" name ="pw" id="pw" minlength="5" placeholder="Limit 5"</p>
	<p> Enter Email Address: <input type="email" name ="email" id="email" placeholder="Enter email address"</p>
	
	<p> Grade: </p>
	<p> Freshman <input type="radio" id ="Freshman" name ="freshman" value="9"></p>
	<p> Sophmore <input type="radio" id ="Sophmore" name ="sophmore" value="10"></p>
	<p> Junior<input type="radio" id ="Junior" name ="junior" value="11"></p>
	<p> Senior<input type="radio" id ="Senior" name ="senior" value="12"></p>
	
	<p> Favorite Shop Class </p>
	<select id = "shops" name ="shops">
		<option value="WCP"> Web and Computer Programming </option>
		<option value="CISCO"> Cisco networking </option>
		<option value="GR"> Graphic Design</option>
	</select>
	
	<p> Possible plans after high school. Select as many options as you would like: 
	
		
	</form>
	
	
</body>
</html>
